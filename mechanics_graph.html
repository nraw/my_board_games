<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Game Mechanics Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; overflow: hidden; }

    canvas { display: block; }

    #controls {
      position: fixed; top: 16px; left: 16px; background: #1e293b; border: 1px solid #334155;
      border-radius: 8px; padding: 12px 16px; font-size: 13px; z-index: 10;
      max-height: calc(100vh - 32px); overflow-y: auto; width: 260px;
    }
    #controls h2 { font-size: 16px; margin-bottom: 8px; }
    #controls label { display: block; margin: 4px 0; cursor: pointer; }
    #controls select, #controls input[type=text] {
      width: 100%; padding: 4px 8px; background: #0f172a; border: 1px solid #475569;
      border-radius: 4px; color: #e2e8f0; font-size: 12px; margin-top: 2px;
    }
    #controls input[type=range] { width: 140px; vertical-align: middle; }
    .control-group { margin: 8px 0; }
    .control-group-title { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .checkbox-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .checkbox-group label { display: flex; align-items: center; gap: 4px; font-size: 12px; }
    .checkbox-group input[type=checkbox] { accent-color: #6366f1; }

    #legend { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: #94a3b8; flex-wrap: wrap; }
    #legend span { display: flex; align-items: center; gap: 4px; }
    #legend .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
    #color-gradient { width: 100%; height: 10px; border-radius: 4px; margin-top: 4px; }
    #color-range-labels { display: flex; justify-content: space-between; font-size: 10px; color: #64748b; }

    #sidebar {
      position: fixed; top: 0; right: 0; width: 340px; height: 100vh; background: #1e293b;
      border-left: 1px solid #334155; padding: 20px; z-index: 20; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.2s ease;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar .close-btn {
      position: absolute; top: 12px; right: 12px; background: none; border: none;
      color: #94a3b8; font-size: 20px; cursor: pointer; line-height: 1;
    }
    #sidebar .close-btn:hover { color: #e2e8f0; }
    #sidebar .node-type { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    #sidebar .node-type.game { color: #60a5fa; }
    #sidebar .node-type.mechanic { color: #fbbf24; }
    #sidebar h3 { font-size: 18px; margin-bottom: 8px; color: #f8fafc; }
    #sidebar .thumb { width: 100%; border-radius: 6px; margin-bottom: 12px; }
    #sidebar .bgg-link {
      display: inline-block; padding: 6px 12px; background: #334155; border-radius: 6px;
      color: #93c5fd; text-decoration: none; font-size: 13px; margin-bottom: 16px;
    }
    #sidebar .bgg-link:hover { background: #475569; }
    #sidebar .section-title { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin: 12px 0 6px; }
    #sidebar ul { list-style: none; padding: 0; }
    #sidebar li { color: #cbd5e1; font-size: 13px; padding: 3px 0; margin-bottom: 4px; }
    .rating-badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px;
      font-weight: 600; margin-left: 4px; vertical-align: middle;
    }
    .rating-badge.personal { background: #312e81; color: #a5b4fc; }
    .rating-badge.bgg { background: #1e3a2f; color: #6ee7b7; }
    .status-badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px;
      font-weight: 600; margin-left: 4px; vertical-align: middle;
    }
    .status-badge.owned { background: #1e3a5f; color: #93c5fd; }
    .status-badge.wishlist { background: #3b2f1e; color: #fcd34d; }
    .status-badge.rated { background: #3b1f2b; color: #f9a8d4; }
    #sidebar .ratings-row { display: flex; gap: 8px; margin: 8px 0 12px; align-items: center; font-size: 13px; }
    #sidebar .ratings-row .rating-label { color: #64748b; font-size: 11px; }
    #sidebar .ratings-row .rating-value { font-size: 18px; font-weight: 600; }
    #sidebar .ratings-row .rating-value.personal { color: #a5b4fc; }
    #sidebar .ratings-row .rating-value.bgg { color: #6ee7b7; }
    #sidebar .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
    #sidebar .stat-item { background: #0f172a; border-radius: 4px; padding: 6px 8px; }
    #sidebar .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; }
    #sidebar .stat-value { font-size: 14px; font-weight: 600; color: #e2e8f0; }
  </style>
</head>
<body>
  <div id="controls">
    <h2>Game Mechanics Graph</h2>
    <input type="text" id="search" placeholder="Search games or mechanics...">

    <div class="control-group">
      <div class="control-group-title">Show</div>
      <div class="checkbox-group">
        <label><input type="checkbox" id="showOwned" checked> Owned</label>
        <label><input type="checkbox" id="showWishlist" checked> Wishlist</label>
        <label><input type="checkbox" id="showRated" checked> Rated</label>
      </div>
    </div>

    <div class="control-group">
      <div class="control-group-title">Color by</div>
      <select id="colorBy">
        <option value="type">Type (Game / Mechanic)</option>
        <option value="personal_rating">Personal Rating</option>
        <option value="bgg_rating">BGG Rating</option>
        <option value="weight">Weight</option>
        <option value="playingtime">Playing Time</option>
        <option value="numplays">Number of Plays</option>
        <option value="minplayers">Min Players</option>
        <option value="maxplayers">Max Players</option>
      </select>
      <div id="legend"></div>
      <canvas id="color-gradient" height="10"></canvas>
      <div id="color-range-labels"></div>
    </div>

    <div class="control-group">
      <div class="control-group-title">Size by</div>
      <select id="sizeBy">
        <option value="type">Type (default)</option>
        <option value="personal_rating">Personal Rating</option>
        <option value="bgg_rating">BGG Rating</option>
        <option value="weight">Weight</option>
        <option value="playingtime">Playing Time</option>
        <option value="numplays">Number of Plays</option>
        <option value="minplayers">Min Players</option>
        <option value="maxplayers">Max Players</option>
      </select>
    </div>

    <div class="control-group">
      <div class="control-group-title">X Axis</div>
      <select id="xAxis">
        <option value="force">Force (default)</option>
        <option value="personal_rating">Personal Rating</option>
        <option value="bgg_rating">BGG Rating</option>
        <option value="weight">Weight</option>
        <option value="playingtime">Playing Time</option>
        <option value="numplays">Number of Plays</option>
        <option value="minplayers">Min Players</option>
        <option value="maxplayers">Max Players</option>
      </select>
    </div>

    <div class="control-group">
      <div class="control-group-title">Y Axis</div>
      <select id="yAxis">
        <option value="force">Force (default)</option>
        <option value="personal_rating">Personal Rating</option>
        <option value="bgg_rating">BGG Rating</option>
        <option value="weight">Weight</option>
        <option value="playingtime">Playing Time</option>
        <option value="numplays">Number of Plays</option>
        <option value="minplayers">Min Players</option>
        <option value="maxplayers">Max Players</option>
      </select>
    </div>

    <div class="control-group">
      <div class="control-group-title">Filters</div>
      <label>Min games/mechanic: <input type="range" id="minLinks" min="1" max="20" value="1"> <span id="minLinksVal">1</span></label>
      <label>Max games/mechanic: <input type="range" id="maxLinks" min="1" max="20" value="20"> <span id="maxLinksVal">20</span></label>
      <label>Min mechanics/game: <input type="range" id="minMechs" min="1" max="20" value="1"> <span id="minMechsVal">1</span></label>
      <label>Max mechanics/game: <input type="range" id="maxMechs" min="1" max="20" value="20"> <span id="maxMechsVal">20</span></label>
    </div>
  </div>

  <div id="sidebar">
    <button class="close-btn" id="sidebarClose">&times;</button>
    <div id="sidebarContent"></div>
  </div>

  <script>
    fetch("data/mechanics.json").then(r => r.json()).then(render);

    const PROPS = {
      personal_rating: { label: "Personal Rating", domain: [1, 10] },
      bgg_rating:      { label: "BGG Rating",      domain: [1, 10] },
      weight:          { label: "Weight",           domain: [1, 5]  },
      playingtime:     { label: "Playing Time",     domain: [0, 240] },
      numplays:        { label: "Num Plays",        domain: [0, 50] },
      minplayers:      { label: "Min Players",      domain: [1, 6]  },
      maxplayers:      { label: "Max Players",      domain: [1, 12] },
    };
    const GAME_COLOR = "#3b82f6", MECH_COLOR = "#f59e0b";
    const BG = "#0f172a";

    function render(data) {
      const W = window.innerWidth, H = window.innerHeight, MARGIN = 80;
      const dpr = window.devicePixelRatio || 1;

      // ===== Canvas setup =====
      const canvas = document.createElement("canvas");
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      document.body.appendChild(canvas);
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      // ===== Build graph =====
      const nodes = [], links = [];
      const nodeById = new Map();
      const adj = new Map();       // id -> Set<id>
      const mechByName = new Map();

      data.games.forEach(g => {
        const n = {
          id: `g${g.id}`, bggId: g.id, name: g.name, type: "game",
          thumbnail: g.thumbnail, mechanics: g.mechanics,
          bgg_rating: g.bgg_rating, personal_rating: g.personal_rating,
          status: g.status || (g.owned ? "owned" : "rated"),
          weight: g.weight, playingtime: g.playingtime,
          minplayers: g.minplayers, maxplayers: g.maxplayers,
          numplays: g.numplays || 0,
          visible: true,
        };
        nodes.push(n);
        nodeById.set(n.id, n);
        adj.set(n.id, new Set());
      });

      data.mechanics.forEach(m => {
        const n = {
          id: `m${m.id}`, bggId: m.id, name: m.name, type: "mechanic",
          games: [], count: 0, visible: true,
        };
        nodes.push(n);
        nodeById.set(n.id, n);
        mechByName.set(m.name, n);
        adj.set(n.id, new Set());
      });

      data.games.forEach(g => {
        const gId = `g${g.id}`;
        g.mechanics.forEach(mName => {
          const mn = mechByName.get(mName);
          if (!mn) return;
          links.push({ source: gId, target: mn.id });
          mn.games.push(g.name); mn.count++;
          adj.get(gId).add(mn.id);
          adj.get(mn.id).add(gId);
        });
      });

      const gameNodes = nodes.filter(n => n.type === "game");
      const mechNodes = nodes.filter(n => n.type === "mechanic");

      // ===== Resolved values with neighbor averaging =====
      let resolvedCache = new Map();

      function getResolved(node, prop) {
        const key = node.id + "|" + prop;
        if (resolvedCache.has(key)) return resolvedCache.get(key);
        let val = node[prop];
        if (val != null && val !== 0) { resolvedCache.set(key, val); return val; }
        const neighbors = adj.get(node.id);
        const vals = [];
        if (node.type === "mechanic") {
          for (const nid of neighbors) {
            const gn = nodeById.get(nid);
            if (gn && gn[prop] != null && gn[prop] !== 0) vals.push(gn[prop]);
          }
        } else {
          for (const mechId of neighbors) {
            for (const sibId of adj.get(mechId)) {
              if (sibId === node.id) continue;
              const sib = nodeById.get(sibId);
              if (sib && sib[prop] != null && sib[prop] !== 0) vals.push(sib[prop]);
            }
          }
        }
        val = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
        resolvedCache.set(key, val);
        return val;
      }

      // ===== Visual mappers =====
      function getColor(n) {
        const mode = $("colorBy").value;
        if (mode === "type") return n.type === "game" ? GAME_COLOR : MECH_COLOR;
        const v = getResolved(n, mode);
        if (v == null) return "#475569";
        const info = PROPS[mode];
        return d3.interpolateViridis(clamp01((v - info.domain[0]) / (info.domain[1] - info.domain[0])));
      }

      function getStroke(n) {
        const mode = $("colorBy").value;
        if (mode === "type") return n.type === "game" ? "#60a5fa" : "#fbbf24";
        const c = d3.color(getColor(n));
        return c ? c.brighter(0.5).toString() : "#94a3b8";
      }

      function getSize(n) {
        const mode = $("sizeBy").value;
        if (mode === "type") return n.type === "game" ? 8 : 4 + Math.sqrt(n.count || 1) * 2;
        const v = getResolved(n, mode);
        if (v == null) return n.type === "game" ? 6 : 4;
        const info = PROPS[mode];
        return 4 + clamp01((v - info.domain[0]) / (info.domain[1] - info.domain[0])) * 14;
      }

      function clamp01(v) { return Math.max(0, Math.min(1, v)); }
      function $(id) { return document.getElementById(id); }

      // ===== Force simulation =====
      const sim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(80))
        .force("charge", d3.forceManyBody().strength(-120))
        .force("center", d3.forceCenter(W / 2, H / 2))
        .force("collision", d3.forceCollide().radius(d => getSize(d) + 2))
        .on("tick", draw);

      // ===== Transform state (pan/zoom) =====
      let tx = 0, ty = 0, tk = 1;

      d3.select(canvas).call(
        d3.zoom().scaleExtent([0.1, 8]).on("zoom", e => {
          tx = e.transform.x; ty = e.transform.y; tk = e.transform.k;
          draw();
        })
      );

      // ===== Highlight state =====
      let highlightId = null;  // id of hovered node
      let highlightSet = null; // Set of ids to show bright

      // ===== Search state =====
      let searchSet = null; // null = no search active

      // ===== Draw =====
      function draw() {
        ctx.save();
        ctx.clearRect(0, 0, W, H);
        ctx.translate(tx, ty);
        ctx.scale(tk, tk);

        const dimming = highlightId != null || searchSet != null;

        // Draw links
        for (const l of links) {
          const s = l.source, t = l.target;
          if (!s.visible || !t.visible) continue;
          let alpha = 0.4;
          if (dimming) {
            if (highlightId != null) {
              alpha = (s.id === highlightId || t.id === highlightId) ? 0.7 : 0.03;
            } else if (searchSet != null) {
              alpha = (searchSet.has(s.id) || searchSet.has(t.id)) ? 0.7 : 0.02;
            }
          }
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(t.x, t.y);
          ctx.strokeStyle = `rgba(51,65,85,${alpha / 0.4})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }

        // Draw nodes + labels
        const labelSize = 9 / tk; // keep labels readable at any zoom
        const mechLabelSize = 7 / tk;

        for (const n of nodes) {
          if (!n.visible) continue;

          let alpha = 1;
          if (dimming) {
            if (highlightId != null) {
              alpha = highlightSet.has(n.id) ? 1 : 0.08;
            } else if (searchSet != null) {
              alpha = searchSet.has(n.id) ? 1 : 0.05;
            }
          }

          ctx.globalAlpha = alpha;
          const r = getSize(n);
          const fill = getColor(n);
          const stroke = getStroke(n);

          if (n.type === "game") {
            // Circle
            ctx.beginPath();
            ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 1;
            ctx.stroke();
          } else {
            // Hexagon
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
              const angle = Math.PI / 3 * i - Math.PI / 6;
              const hx = n.x + Math.cos(angle) * r;
              const hy = n.y + Math.sin(angle) * r;
              i === 0 ? ctx.moveTo(hx, hy) : ctx.lineTo(hx, hy);
            }
            ctx.closePath();
            ctx.fillStyle = fill;
            ctx.fill();
            ctx.strokeStyle = stroke;
            ctx.lineWidth = 1;
            ctx.stroke();
          }

          // Label
          ctx.fillStyle = n.type === "game" ? "#93c5fd" : "#fcd34d";
          ctx.font = `${n.type === "game" ? labelSize : mechLabelSize}px system-ui, sans-serif`;
          ctx.textBaseline = "middle";
          ctx.fillText(n.name, n.x + r + 4, n.y);
        }

        ctx.globalAlpha = 1;
        ctx.restore();
      }

      // ===== Hit detection via quadtree =====
      function findNode(mx, my) {
        // Convert screen coords to graph coords
        const gx = (mx - tx) / tk;
        const gy = (my - ty) / tk;
        let closest = null, closestDist = Infinity;
        for (const n of nodes) {
          if (!n.visible) continue;
          const dx = n.x - gx, dy = n.y - gy;
          const dist = dx * dx + dy * dy;
          const r = getSize(n) + 4; // slight padding for easier hit
          if (dist < r * r && dist < closestDist) {
            closest = n; closestDist = dist;
          }
        }
        return closest;
      }

      // ===== Mouse interaction =====
      let dragNode = null, isDragging = false, downX = 0, downY = 0;

      canvas.addEventListener("mousemove", e => {
        if (dragNode) {
          // Dragging a node
          isDragging = true;
          dragNode.fx = (e.clientX - tx) / tk;
          dragNode.fy = (e.clientY - ty) / tk;
          sim.alpha(0.3).restart();
          return;
        }
        // Hover highlight
        const hit = findNode(e.clientX, e.clientY);
        if (hit) {
          highlightId = hit.id;
          highlightSet = new Set([hit.id, ...adj.get(hit.id)]);
          canvas.style.cursor = "pointer";
        } else {
          highlightId = null;
          highlightSet = null;
          canvas.style.cursor = "default";
        }
        draw();
      });

      canvas.addEventListener("mousedown", e => {
        const hit = findNode(e.clientX, e.clientY);
        if (hit) {
          downX = e.clientX; downY = e.clientY;
          dragNode = hit;
          isDragging = false;
          hit.fx = hit.x; hit.fy = hit.y;
          sim.alphaTarget(0.3).restart();
          // Prevent zoom from starting when we're dragging a node
          e.stopPropagation();
        }
      });

      canvas.addEventListener("mouseup", e => {
        if (dragNode) {
          const dx = e.clientX - downX, dy = e.clientY - downY;
          const wasDrag = dx * dx + dy * dy > 16;

          if (!wasDrag) {
            // It was a click, not a drag — open sidebar
            openSidebar(dragNode);
          }

          dragNode.fx = null; dragNode.fy = null;
          dragNode = null; isDragging = false;
          sim.alphaTarget(0);
        } else {
          // Clicked empty space — close sidebar
          $("sidebar").classList.remove("open");
        }
      });

      canvas.addEventListener("mouseleave", () => {
        highlightId = null; highlightSet = null;
        draw();
      });

      // Re-dispatch mousedown to zoom behavior when not on a node
      // (We stopped propagation above when hitting a node, so zoom still works on empty space)
      // Actually d3.zoom is already bound — we need to let it through for empty space.
      // The stopPropagation on node-hit mousedown prevents zoom from stealing the drag.
      // But we bound zoom with d3.select(canvas).call(zoom) which uses addEventListener,
      // and stopPropagation prevents it. That's correct for node drags.
      // For empty space mousedowns, we don't call stopPropagation so zoom works.

      $("sidebarClose").addEventListener("click", () => $("sidebar").classList.remove("open"));

      // ===== Sidebar =====
      function ratingBadges(d) {
        let h = "";
        if (d.personal_rating != null) h += `<span class="rating-badge personal">${d.personal_rating}</span>`;
        if (d.bgg_rating != null) h += `<span class="rating-badge bgg">${d.bgg_rating}</span>`;
        return h;
      }
      function statusBadge(s) {
        return `<span class="status-badge ${s}">${{owned:"Owned",wishlist:"Wishlist",rated:"Rated only"}[s]||s}</span>`;
      }
      function simBar(shared, max) {
        const pct = Math.round(shared / max * 100);
        return `<div style="display:flex;align-items:center;gap:6px;margin:2px 0">
          <div style="flex:1;height:4px;background:#334155;border-radius:2px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:#6366f1;border-radius:2px"></div>
          </div><span style="font-size:11px;color:#94a3b8;min-width:20px">${shared}</span></div>`;
      }

      const gameMechSets = new Map();
      gameNodes.forEach(g => gameMechSets.set(g.id, new Set(g.mechanics)));
      const mechGameSets = new Map();
      mechNodes.forEach(m => mechGameSets.set(m.id, new Set(m.games)));

      function topSimilar(d, pool, getSets, n = 10) {
        const mine = getSets.get(d.id);
        if (!mine || !mine.size) return [];
        const out = [];
        for (const other of pool) {
          if (other.id === d.id) continue;
          const theirs = getSets.get(other.id);
          const shared = [...mine].filter(x => theirs.has(x));
          if (shared.length) out.push({ node: other, shared: shared.length, union: new Set([...mine, ...theirs]).size, names: shared });
        }
        out.sort((a, b) => b.shared - a.shared || a.union - b.union);
        return out.slice(0, n);
      }

      function openSidebar(d) {
        let h = "";
        if (d.type === "game") {
          h += `<div class="node-type game">Game ${statusBadge(d.status)}</div>`;
          h += `<h3>${d.name}</h3>`;
          h += `<div class="ratings-row">`;
          if (d.personal_rating != null) h += `<div><div class="rating-label">My Rating</div><div class="rating-value personal">${d.personal_rating}</div></div>`;
          if (d.bgg_rating != null) h += `<div><div class="rating-label">BGG Average</div><div class="rating-value bgg">${d.bgg_rating}</div></div>`;
          if (d.personal_rating == null && d.bgg_rating == null) h += `<div style="color:#64748b;font-size:12px">No ratings</div>`;
          h += `</div>`;
          h += `<div class="stats-grid">`;
          if (d.weight != null) h += `<div class="stat-item"><div class="stat-label">Weight</div><div class="stat-value">${d.weight.toFixed(2)}</div></div>`;
          if (d.playingtime != null) h += `<div class="stat-item"><div class="stat-label">Play Time</div><div class="stat-value">${d.playingtime} min</div></div>`;
          if (d.minplayers != null) h += `<div class="stat-item"><div class="stat-label">Players</div><div class="stat-value">${d.minplayers}–${d.maxplayers}</div></div>`;
          h += `<div class="stat-item"><div class="stat-label">Plays</div><div class="stat-value">${d.numplays}</div></div>`;
          h += `</div>`;
          if (d.thumbnail) h += `<img class="thumb" src="${d.thumbnail}" alt="${d.name}">`;
          h += `<a class="bgg-link" href="https://boardgamegeek.com/boardgame/${d.bggId}" target="_blank">View on BGG</a>`;
          h += `<div class="section-title">Mechanics (${d.mechanics.length})</div><ul>`;
          d.mechanics.forEach(m => {
            const mn = mechByName.get(m);
            h += mn
              ? `<li><a href="https://boardgamegeek.com/boardgamemechanic/${mn.bggId}" target="_blank" style="color:#fcd34d;text-decoration:none">${m}</a></li>`
              : `<li>${m}</li>`;
          });
          h += `</ul>`;
          const sims = topSimilar(d, gameNodes, gameMechSets);
          if (sims.length) {
            h += `<div class="section-title">Most Similar Games</div><ul>`;
            sims.forEach(s => {
              h += `<li><a href="https://boardgamegeek.com/boardgame/${s.node.bggId}" target="_blank" style="color:#93c5fd;text-decoration:none">${s.node.name}</a>`;
              h += ratingBadges(s.node) + simBar(s.shared, d.mechanics.length);
              h += `<span style="font-size:11px;color:#64748b">${s.names.join(", ")}</span></li>`;
            });
            h += `</ul>`;
          }
        } else {
          h += `<div class="node-type mechanic">Mechanic</div>`;
          h += `<h3>${d.name}</h3>`;
          h += `<a class="bgg-link" href="https://boardgamegeek.com/boardgamemechanic/${d.bggId}" target="_blank">View on BGG</a>`;
          const mg = (d.games || []).map(gn => nodes.find(n => n.type === "game" && n.name === gn)).filter(Boolean);
          const wp = mg.filter(g => g.personal_rating != null);
          const wb = mg.filter(g => g.bgg_rating != null);
          h += `<div class="ratings-row">`;
          if (wp.length) h += `<div><div class="rating-label">Avg My Rating (${wp.length})</div><div class="rating-value personal">${(wp.reduce((s,g)=>s+g.personal_rating,0)/wp.length).toFixed(1)}</div></div>`;
          if (wb.length) h += `<div><div class="rating-label">Avg BGG (${wb.length})</div><div class="rating-value bgg">${(wb.reduce((s,g)=>s+g.bgg_rating,0)/wb.length).toFixed(1)}</div></div>`;
          h += `</div>`;
          const gw = mg.filter(g => g.weight), gt = mg.filter(g => g.playingtime);
          h += `<div class="stats-grid">`;
          if (gw.length) h += `<div class="stat-item"><div class="stat-label">Avg Weight</div><div class="stat-value">${(gw.reduce((s,g)=>s+g.weight,0)/gw.length).toFixed(2)}</div></div>`;
          if (gt.length) h += `<div class="stat-item"><div class="stat-label">Avg Time</div><div class="stat-value">${Math.round(gt.reduce((s,g)=>s+g.playingtime,0)/gt.length)} min</div></div>`;
          h += `<div class="stat-item"><div class="stat-label">Games</div><div class="stat-value">${mg.length}</div></div></div>`;
          h += `<div class="section-title">Games (${mg.length})</div><ul>`;
          mg.sort((a, b) => (b.personal_rating ?? -1) - (a.personal_rating ?? -1));
          mg.forEach(g => {
            h += `<li><a href="https://boardgamegeek.com/boardgame/${g.bggId}" target="_blank" style="color:#93c5fd;text-decoration:none">${g.name}</a>${ratingBadges(g)}</li>`;
          });
          h += `</ul>`;
          const sims = topSimilar(d, mechNodes, mechGameSets);
          if (sims.length) {
            h += `<div class="section-title">Most Similar Mechanics</div><ul>`;
            sims.forEach(s => {
              h += `<li><a href="https://boardgamegeek.com/boardgamemechanic/${s.node.bggId}" target="_blank" style="color:#fcd34d;text-decoration:none">${s.node.name}</a>`;
              h += simBar(s.shared, (d.games || []).length);
              h += `<span style="font-size:11px;color:#64748b">${s.names.join(", ")}</span></li>`;
            });
            h += `</ul>`;
          }
        }
        $("sidebarContent").innerHTML = h;
        $("sidebar").classList.add("open");
      }

      // ===== Filtering =====
      const maxGC = Math.max(...mechNodes.map(m => m.count));
      const maxMC = Math.max(...gameNodes.map(g => g.mechanics.length));
      $("minLinks").max = Math.min(maxGC, 30);
      $("maxLinks").max = Math.min(maxGC, 30); $("maxLinks").value = Math.min(maxGC, 30);
      $("maxLinksVal").textContent = $("maxLinks").value;
      $("minMechs").max = Math.min(maxMC, 30);
      $("maxMechs").max = Math.min(maxMC, 30); $("maxMechs").value = Math.min(maxMC, 30);
      $("maxMechsVal").textContent = $("maxMechs").value;

      function applyFilter() {
        const minG = +$("minLinks").value, maxG = +$("maxLinks").value;
        const minM = +$("minMechs").value, maxM = +$("maxMechs").value;
        $("minLinksVal").textContent = minG; $("maxLinksVal").textContent = maxG;
        $("minMechsVal").textContent = minM; $("maxMechsVal").textContent = maxM;
        const showO = $("showOwned").checked, showW = $("showWishlist").checked, showR = $("showRated").checked;

        for (const n of nodes) {
          if (n.type === "mechanic") {
            n.visible = n.count >= minG && n.count <= maxG;
          } else {
            const mc = n.mechanics.length;
            if (mc < minM || mc > maxM) { n.visible = false; continue; }
            if (n.status === "owned" && !showO) { n.visible = false; continue; }
            if (n.status === "wishlist" && !showW) { n.visible = false; continue; }
            if (n.status === "rated" && !showR) { n.visible = false; continue; }
            n.visible = true;
          }
        }
        draw();
      }

      for (const id of ["minLinks","maxLinks","minMechs","maxMechs"]) $(id).addEventListener("input", applyFilter);
      for (const id of ["showOwned","showWishlist","showRated"]) $(id).addEventListener("change", applyFilter);

      // ===== Search =====
      $("search").addEventListener("input", function() {
        const q = this.value.toLowerCase();
        if (!q) { searchSet = null; draw(); return; }
        const matched = new Set();
        for (const n of nodes) {
          if (n.name.toLowerCase().includes(q)) {
            matched.add(n.id);
            for (const nid of adj.get(n.id)) matched.add(nid);
          }
        }
        searchSet = matched;
        draw();
      });

      // ===== Update visuals =====
      function updateVisuals() {
        resolvedCache.clear();
        sim.force("collision", d3.forceCollide().radius(d => getSize(d) + 2));
        sim.alpha(0.3).restart();
        updateLegend();
      }

      function updateLegend() {
        const mode = $("colorBy").value;
        if (mode === "type") {
          $("legend").innerHTML = `<span><span class="swatch" style="background:${GAME_COLOR}"></span> Game (circle)</span>
            <span><span class="swatch" style="background:${MECH_COLOR}"></span> Mechanic (hexagon)</span>`;
          $("color-gradient").style.display = "none";
          $("color-range-labels").innerHTML = "";
        } else {
          const info = PROPS[mode];
          $("legend").innerHTML = `<span><span class="swatch" style="background:#475569"></span> No data</span>`;
          const gc = $("color-gradient"); gc.style.display = "block";
          const gctx = gc.getContext("2d");
          gc.width = gc.offsetWidth || 228;
          for (let i = 0; i < gc.width; i++) {
            gctx.fillStyle = d3.interpolateViridis(i / gc.width);
            gctx.fillRect(i, 0, 1, 10);
          }
          $("color-range-labels").innerHTML = `<span>${info.domain[0]}</span><span>${info.label}</span><span>${info.domain[1]}</span>`;
        }
      }

      // ===== Axis pinning =====
      function updateForces() {
        resolvedCache.clear();
        const xMode = $("xAxis").value, yMode = $("yAxis").value;
        if (xMode === "force") {
          sim.force("x", null);
        } else {
          const info = PROPS[xMode];
          const vals = nodes.map(n => getResolved(n, xMode)).filter(v => v != null);
          const ext = d3.extent(vals);
          const sc = d3.scaleLinear().domain([ext[0] ?? info.domain[0], ext[1] ?? info.domain[1]]).range([MARGIN, W - MARGIN]).clamp(true);
          sim.force("x", d3.forceX(d => { const v = getResolved(d, xMode); return v != null ? sc(v) : W / 2; }).strength(0.8));
        }
        if (yMode === "force") {
          sim.force("y", null);
        } else {
          const info = PROPS[yMode];
          const vals = nodes.map(n => getResolved(n, yMode)).filter(v => v != null);
          const ext = d3.extent(vals);
          const sc = d3.scaleLinear().domain([ext[0] ?? info.domain[0], ext[1] ?? info.domain[1]]).range([H - MARGIN, MARGIN]).clamp(true);
          sim.force("y", d3.forceY(d => { const v = getResolved(d, yMode); return v != null ? sc(v) : H / 2; }).strength(0.8));
        }
        const both = xMode !== "force" && yMode !== "force";
        sim.force("center", both ? null : d3.forceCenter(W / 2, H / 2));
        sim.force("charge", d3.forceManyBody().strength(both ? -30 : -120));
        sim.force("link").distance(both ? 30 : 80);
        sim.alpha(0.6).restart();
      }

      $("colorBy").addEventListener("change", updateVisuals);
      $("sizeBy").addEventListener("change", updateVisuals);
      $("xAxis").addEventListener("change", updateForces);
      $("yAxis").addEventListener("change", updateForces);

      updateLegend();
    }
  </script>
</body>
</html>
